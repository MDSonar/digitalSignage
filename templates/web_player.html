<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Litmus Signage Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0f172a;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
        }
        
        body.playing {
            cursor: auto;
            background: #000;
        }
        
        body.playing.cursor-hidden {
            cursor: none;
        }
        
        /* Playlist Selection Screen */
        #playlist-selection {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        
        #playlist-selection h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-align: center;
        }
        
        #playlist-selection .subtitle {
            font-size: 1.2em;
            opacity: 0.7;
            margin-bottom: 40px;
            text-align: center;
        }
        
        #playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 20px;
        }
        
        .playlist-card {
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 40px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .playlist-card:hover {
            background: rgba(102, 126, 234, 0.3);
            border-color: rgba(102, 126, 234, 0.8);
            transform: translateY(-5px);
        }
        
        .playlist-card.selected {
            background: rgba(102, 126, 234, 0.4);
            border-color: #667eea;
            border-width: 4px;
        }
        
        .playlist-card h2 {
            font-size: 2em;
            margin-bottom: 15px;
        }
        
        .playlist-card .meta {
            font-size: 1.1em;
            opacity: 0.8;
            margin-top: 10px;
        }
        
        #deeplink-info {
            margin-top: 20px;
            opacity: 0.6;
            font-size: 0.9em;
        }
        
        /* Player Container */
        #player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        
        video, img, iframe#youtube-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
        }
        
        .hidden {
            display: none !important;
        }
        
        #loading {
            color: white;
            font-size: 2em;
            text-align: center;
        }

        /* Switch playlist button */
        #switch-playlist-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.12);
            color: #fff;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            backdrop-filter: blur(6px);
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
        }
        #switch-playlist-btn:hover { background: rgba(255,255,255,0.18); }
        #switch-playlist-btn.hidden-controls { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <!-- Playlist Selection Screen -->
    <div id="playlist-selection">
        <h1>🖥️ Litmus Signage Player</h1>
        <div class="subtitle">Select a playlist to play on this screen</div>
        <div id="playlist-grid"></div>
        <div id="deeplink-info">Tip: Use ?playlist_id=&lt;id&gt; to deep-link to a specific playlist</div>
    </div>
    
    <!-- Player Container -->
    <div id="player-container" class="hidden">
        <div id="loading">Loading...</div>
        <video id="video-player" class="hidden" autoplay playsinline></video>
        <img id="image-player" class="hidden">
        <div id="youtube-container" class="hidden">
            <iframe id="youtube-player" style="width:100%;height:100%;border:none;" allow="autoplay"></iframe>
        </div>
    </div>

    <button id="switch-playlist-btn" class="hidden">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
    </button>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        console.log('Web Player v2.0 - Per-Client Playlist Selection');
        
        // ===== PLAYLIST SELECTION =====
        const STORAGE_KEY = 'signage.selected_playlist_id';
        const playlistSelection = document.getElementById('playlist-selection');
        const playlistGrid = document.getElementById('playlist-grid');
        const playerContainer = document.getElementById('player-container');
        
        let selectedPlaylistId = null;
        let selectedSource = null; // 'url' | 'localStorage' | 'server-active' | null
        let availablePlaylists = [];
        
        // Check for URL parameter ?playlist_id=xxx
        const urlParams = new URLSearchParams(window.location.search);
        let activeUrlPlaylistId = urlParams.get('playlist_id');
        
        if (activeUrlPlaylistId) {
            console.log('Deep-link playlist from URL:', activeUrlPlaylistId);
            selectedPlaylistId = activeUrlPlaylistId;
            selectedSource = 'url';
        } else {
            // Try localStorage
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    console.log('Loaded playlist from localStorage:', stored);
                    selectedPlaylistId = stored;
                    selectedSource = 'localStorage';
                }
            } catch (e) {
                console.warn('localStorage unavailable:', e);
            }
        }
        
        // Load playlists and show selection screen
        async function loadPlaylists() {
            try {
                const res = await fetch('/api/playlists');
                if (!res.ok) throw new Error('Failed to fetch playlists');
                
                const data = await res.json();
                availablePlaylists = data.playlists || [];
                
                // If no selection yet, preselect server active but do NOT autoplay
                if (!selectedPlaylistId && data.active_playlist_id) {
                    console.log('Preselecting server active playlist (no autoplay):', data.active_playlist_id);
                    selectedPlaylistId = data.active_playlist_id;
                    selectedSource = 'server-active';
                }
                
                renderPlaylistCards();
                
                // Autostart only for URL deep-link or persisted localStorage; never for server fallback
                if (selectedPlaylistId && (selectedSource === 'url' || selectedSource === 'localStorage')) {
                    startPlayback();
                }
            } catch (error) {
                console.error('Error loading playlists:', error);
                playlistGrid.innerHTML = '<div style="color:#ef4444;font-size:1.2em">Failed to load playlists</div>';
            }
        }
        
        function renderPlaylistCards() {
            playlistGrid.innerHTML = '';
            
            if (availablePlaylists.length === 0) {
                playlistGrid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; opacity:0.7">No playlists available</div>';
                return;
            }
            
            availablePlaylists.forEach(pl => {
                const card = document.createElement('div');
                card.className = 'playlist-card';
                if (pl.id === selectedPlaylistId) {
                    card.classList.add('selected');
                }
                
                card.innerHTML = `
                    <h2>${escapeHtml(pl.name)}</h2>
                    <div class="meta">${pl.itemCount || 0} items</div>
                `;
                
                card.onclick = () => selectPlaylist(pl.id);
                playlistGrid.appendChild(card);
            });
        }
        
        function selectPlaylist(playlistId) {
            console.log('Playlist selected:', playlistId);
            selectedPlaylistId = playlistId;
            
            // Persist to localStorage (unless it's a URL override)
            if (!activeUrlPlaylistId) {
                try {
                    localStorage.setItem(STORAGE_KEY, playlistId);
                    console.log('Saved to localStorage');
                } catch (e) {
                    console.warn('Failed to save to localStorage:', e);
                }
            }
            
            renderPlaylistCards();
            startPlayback();
        }

        function resetSelection(clearUrl = true) {
            console.log('Resetting selection to show chooser');
            stopPlayer();
            document.body.classList.remove('playing');
            playerContainer.classList.add('hidden');
            playlistSelection.classList.remove('hidden');
            switchBtn.classList.add('hidden');
            selectedPlaylistId = null;
            selectedSource = null;
            playlist = [];
            currentIndex = 0;
            playlistHash = null;
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (e) {}
            if (clearUrl && activeUrlPlaylistId) {
                // remove playlist_id from URL so reload won't reapply deep link
                const url = new URL(window.location.href);
                url.searchParams.delete('playlist_id');
                window.history.replaceState({}, '', url.toString());
                activeUrlPlaylistId = null;
            }
            loadPlaylists();
        }
        
        function startPlayback() {
            console.log('Starting playback for playlist:', selectedPlaylistId);
            
            // Hide selection screen, show player
            playlistSelection.classList.add('hidden');
            playerContainer.classList.remove('hidden');
            document.body.classList.add('playing');
            switchBtn.classList.remove('hidden');
            
            // Initialize cursor/controls auto-hide
            initAutoHideControls();
            
            // Try fullscreen
            try {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(e => console.log('Fullscreen denied'));
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            } catch (e) {
                console.log('Fullscreen not available:', e);
            }
            
            // Start player loop
            startPlayer();
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ===== PLAYER LOGIC =====
        let playlist = [];
        let currentIndex = 0;
        let playlistHash = null;
        let isPlaying = false;
        let fetchInterval = null;
        let youtubePlayer = null;
        let youtubePlayerReady = false;
        let youtubeEndTimer = null;
        let pendingYoutubeId = null;
        let pendingYoutubeDurationSec = null;
        let youtubeStartTs = null;
        let youtubeMaxMs = null;
        
        const videoPlayer = document.getElementById('video-player');
        const imagePlayer = document.getElementById('image-player');
        const loading = document.getElementById('loading');
        const youtubeContainer = document.getElementById('youtube-container');
        const youtubeIframe = document.getElementById('youtube-player');
        const switchBtn = document.getElementById('switch-playlist-btn');
        if (switchBtn) {
            switchBtn.addEventListener('click', () => resetSelection(true));
        }
        
        function startPlayer() {
            console.log('Starting player with playlist:', selectedPlaylistId);
            
            // Fetch once immediately
            fetchPlaylist();
            
            // Clear any existing interval first
            if (fetchInterval) {
                clearInterval(fetchInterval);
            }
            
            // Then fetch every 10 seconds
            fetchInterval = setInterval(fetchPlaylist, 10000);
        }
        
        function stopPlayer() {
            console.log('Stopping player');
            if (fetchInterval) {
                clearInterval(fetchInterval);
                fetchInterval = null;
            }
            
            // Stop all media
            try {
                videoPlayer.pause();
                videoPlayer.src = '';
            } catch (e) {}
            
            try {
                imagePlayer.src = '';
            } catch (e) {}
            
            try {
                if (youtubePlayer && youtubePlayer.stopVideo) {
                    youtubePlayer.stopVideo();
                }
                youtubeIframe.src = '';
            } catch (e) {}
            
            isPlaying = false;
            playlist = [];
            currentIndex = 0;
            playlistHash = null;
        }
        
        async function fetchPlaylist() {
            try {
                // Fetch playlist with explicit ID
                const url = selectedPlaylistId ? 
                    `/api/playlist?playlist_id=${encodeURIComponent(selectedPlaylistId)}` : 
                    '/api/playlist';
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('API error');
                }
                
                const data = await response.json();
                
                // Check if playlist changed
                if (data.hash !== playlistHash) {
                    console.log('Playlist updated:', playlist.length === 0 ? 'first load' : 'content changed');
                    const wasEmpty = playlist.length === 0;
                    playlist = data.playlist || [];
                    playlistHash = data.hash;
                    
                    if (playlist.length > 0) {
                        loading.classList.add('hidden');
                        // Only start playback if this is the first load (playlist was empty)
                        if (wasEmpty) {
                            currentIndex = 0;
                            isPlaying = false;
                            playNext();
                        }
                        // If playlist changed during playback, the next item will pick up new content
                    } else {
                        loading.textContent = 'No content in playlist';
                        loading.classList.remove('hidden');
                    }
                }
                
            } catch (error) {
                console.error('Fetch error:', error);
                loading.textContent = 'Connection error';
                loading.classList.remove('hidden');
            }
        }
        
        function playNext() {
            if (playlist.length === 0 || isPlaying) {
                return; // FIXED: Prevent duplicate playback
            }
            
            isPlaying = true;
            loading.classList.add('hidden');
            
            const item = playlist[currentIndex];
            console.log('Playing:', item.name);
            
            if (item.type === 'video') {
                imagePlayer.classList.add('hidden');
                videoPlayer.classList.remove('hidden');
                videoPlayer.src = item.url;
                videoPlayer.muted = false; // keep unmuted
                videoPlayer.play().catch(err => {
                    console.error('Play error:', err);
                    isPlaying = false;
                    nextItem();
                });
            } else if (item.type === 'image') {
                videoPlayer.classList.add('hidden');
                imagePlayer.classList.remove('hidden');
                imagePlayer.src = item.url;
                
                // FIXED: Use setTimeout safely
                setTimeout(() => {
                    isPlaying = false;
                    nextItem();
                }, (item.duration || 10) * 1000);
            } else if (item.type === 'youtube') {
                videoPlayer.classList.add('hidden');
                imagePlayer.classList.add('hidden');
                youtubeContainer.classList.remove('hidden');

                // Convert URL to embeddable format
                const embedUrl = convertToEmbed(item.url);
                const videoId = embedUrl.split('/embed/')[1];
                if (youtubeEndTimer) {
                    clearTimeout(youtubeEndTimer);
                    youtubeEndTimer = null;
                }
                pendingYoutubeDurationSec = null;
                youtubeStartTs = Date.now();
                youtubeMaxMs = null;

                pendingYoutubeId = videoId;

                if (youtubePlayerReady && youtubePlayer) {
                    youtubePlayer.mute(); // ensure autoplay allowed
                    youtubePlayer.loadVideoById(videoId);
                    youtubePlayer.playVideo();
                    youtubePlayer.setVolume(100);
                    // Try to schedule a duration-based fallback after player reports duration
                    scheduleYoutubeTimeout();
                } else {
                    // Fallback: direct iframe load (muted to satisfy autoplay), will stay muted until API kicks in
                    youtubeIframe.src = embedUrl + (embedUrl.includes('?') ? '&' : '?') + 'autoplay=1&mute=1&rel=0&enablejsapi=1&origin=' + encodeURIComponent(window.location.origin);
                }

                // Fallback timeout: move on after 10 minutes if API end event fails
                youtubeEndTimer = setTimeout(() => {
                    console.warn('YouTube fallback timeout reached; advancing');
                    youtubeContainer.classList.add('hidden');
                    youtubeIframe.src = '';
                    if (youtubePlayer && youtubePlayer.stopVideo) youtubePlayer.stopVideo();
                    isPlaying = false;
                    nextItem();
                }, 10 * 60 * 1000);
            }
        }
        
        function convertToEmbed(url) {
            // Handle youtube.com/watch?v=VIDEO_ID format
            if (url.includes('youtube.com/watch?v=')) {
                const videoId = url.split('watch?v=')[1].split('&')[0];
                return `https://www.youtube.com/embed/${videoId}`;
            }
            // Handle youtu.be/VIDEO_ID format
            if (url.includes('youtu.be/')) {
                const videoId = url.split('youtu.be/')[1].split('?')[0];
                return `https://www.youtube.com/embed/${videoId}`;
            }
            // Handle already embedded URLs
            if (url.includes('youtube.com/embed/')) {
                return url;
            }
            // Fallback: return as-is
            return url;
        }

        function nextItem() {
            currentIndex = (currentIndex + 1) % playlist.length;
            isPlaying = false;
            youtubeStartTs = null;
            youtubeMaxMs = null;
            playNext();
        }

        function scheduleYoutubeTimeout() {
            if (!youtubePlayer) return;
            let dur = 0;
            try {
                dur = youtubePlayer.getDuration();
            } catch (e) {
                dur = 0;
            }
            if (!dur || !isFinite(dur) || dur <= 0) {
                // unknown duration, keep existing fallback
                return;
            }
            pendingYoutubeDurationSec = dur;
            const bufferMs = 7000; // 7s buffer after expected end
            youtubeMaxMs = (dur * 1000) + bufferMs;
        }
        
        // Video ended - play next
        videoPlayer.onended = function() {
            isPlaying = false;
            nextItem();
        };
        
        // Video error - skip to next
        videoPlayer.onerror = function() {
            console.error('Video error');
            isPlaying = false;
            nextItem();
        };
        
        // Image error - skip to next
        imagePlayer.onerror = function() {
            console.error('Image error');
            isPlaying = false;
            nextItem();
        };
        
        // YouTube IFrame API callback when script loads
        function onYouTubeIframeAPIReady() {
            console.log('YouTube IFrame API ready');
            youtubePlayer = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                events: {
                    'onReady': onYouTubePlayerReady,
                    'onStateChange': onYouTubeStateChange,
                    'onError': onYouTubeError
                }
            });
        }
        
        function onYouTubePlayerReady(event) {
            console.log('YouTube player ready');
            youtubePlayerReady = true;
            if (pendingYoutubeId) {
                youtubePlayer.mute();
                youtubePlayer.loadVideoById(pendingYoutubeId);
                youtubePlayer.playVideo();
                youtubePlayer.setVolume(100);
                scheduleYoutubeTimeout();
            }
        }
        
        function onYouTubeStateChange(event) {
            // State 0 = ended, 1 = playing, 2 = paused, etc.
            if (event.data === YT.PlayerState.ENDED) {
                console.log('YouTube video ended');
                youtubeContainer.classList.add('hidden');
                if (youtubePlayer && youtubePlayer.stopVideo) youtubePlayer.stopVideo();
                if (youtubeEndTimer) { clearTimeout(youtubeEndTimer); youtubeEndTimer = null; }
                youtubeStartTs = null;
                youtubeMaxMs = null;
                pendingYoutubeId = null;
                pendingYoutubeDurationSec = null;
                isPlaying = false;
                nextItem();
            } else if (event.data === YT.PlayerState.PLAYING) {
                console.log('YouTube video playing');
                // Ensure unmuted when playing
                try { youtubePlayer.unMute(); youtubePlayer.setVolume(100); } catch (e) {}
                if (youtubeEndTimer) { clearTimeout(youtubeEndTimer); youtubeEndTimer = null; }
                youtubeStartTs = Date.now();
                scheduleYoutubeTimeout();
            } else if (event.data === YT.PlayerState.UNSTARTED) {
                // Fallback: if video doesn't auto-start, play it manually
                if (isPlaying) {
                    try { youtubePlayer.mute(); youtubePlayer.playVideo(); youtubePlayer.setVolume(100); } catch (e) {}
                }
            }
        }
        
        function onYouTubeError(event) {
            console.error('YouTube error:', event.data);
            youtubeContainer.classList.add('hidden');
            isPlaying = false;
            nextItem();
        }
        
        function youtubeAdvance() {
            youtubeContainer.classList.add('hidden');
            youtubeIframe.src = '';
            try { if (youtubePlayer && youtubePlayer.stopVideo) youtubePlayer.stopVideo(); } catch (e) {}
            if (youtubeEndTimer) { clearTimeout(youtubeEndTimer); youtubeEndTimer = null; }
            youtubeStartTs = null;
            youtubeMaxMs = null;
            pendingYoutubeId = null;
            pendingYoutubeDurationSec = null;
            isPlaying = false;
            nextItem();
        }

        function youtubeWatchdog(){
            if (!youtubeStartTs) return;
            const now = Date.now();
            const elapsed = now - youtubeStartTs;
            const maxMs = youtubeMaxMs || (5 * 60 * 1000); // default 5 min
            // If YouTube has been running longer than expected, advance
            if (elapsed > maxMs) {
                console.warn('YouTube watchdog timeout; advancing');
                youtubeAdvance();
                return;
            }
            // If stuck unstarted/paused/buffering too long after start, try to resume or skip
            if (youtubePlayer) {
                let state = null;
                try { state = youtubePlayer.getPlayerState(); } catch (e) { state = null; }
                if (state !== null) {
                    // If not playing and more than 20s since start, try play; after 35s, skip
                    if (state !== YT.PlayerState.PLAYING) {
                        if (elapsed > 20000 && elapsed < 35000) {
                            try { youtubePlayer.mute(); youtubePlayer.playVideo(); youtubePlayer.setVolume(100); } catch (e) {}
                        } else if (elapsed >= 35000) {
                            console.warn('YouTube stalled; advancing');
                            youtubeAdvance();
                        }
                    }
                }
            }
        }

        // ===== AUTO-HIDE CURSOR AND CONTROLS =====
        let cursorHideTimeout = null;
        let controlsHideTimeout = null;
        const CURSOR_HIDE_DELAY = 3000; // 3 seconds
        const CONTROLS_HIDE_DELAY = 5000; // 5 seconds
        
        function initAutoHideControls() {
            // Show cursor and controls initially
            document.body.classList.remove('cursor-hidden');
            switchBtn.classList.remove('hidden-controls');
            
            // Reset timers
            resetCursorTimer();
            resetControlsTimer();
            
            // Listen for mouse movement and touch events
            const activityEvents = ['mousemove', 'mousedown', 'touchstart', 'touchmove'];
            activityEvents.forEach(eventType => {
                document.addEventListener(eventType, handleUserActivity);
            });
        }
        
        function handleUserActivity() {
            // Show cursor and controls
            document.body.classList.remove('cursor-hidden');
            switchBtn.classList.remove('hidden-controls');
            
            // Reset hide timers
            resetCursorTimer();
            resetControlsTimer();
        }
        
        function resetCursorTimer() {
            if (cursorHideTimeout) {
                clearTimeout(cursorHideTimeout);
            }
            cursorHideTimeout = setTimeout(() => {
                if (document.body.classList.contains('playing')) {
                    document.body.classList.add('cursor-hidden');
                }
            }, CURSOR_HIDE_DELAY);
        }
        
        function resetControlsTimer() {
            if (controlsHideTimeout) {
                clearTimeout(controlsHideTimeout);
            }
            controlsHideTimeout = setTimeout(() => {
                if (document.body.classList.contains('playing')) {
                    switchBtn.classList.add('hidden-controls');
                }
            }, CONTROLS_HIDE_DELAY);
        }

        // Prevent context menu
        document.oncontextmenu = () => false;
        
        console.log('Ready - Click button to start');
        
            // Poll command endpoint for remote control from dashboard
            // Use localStorage to deduplicate commands so every connected web player
            // executes each command exactly once. The server keeps the last command
            // file; clients compare timestamps (ts) to determine new commands.
            const CMD_TS_KEY = 'signage:web:lastCommandTs';

            async function pollCommands() {
                try {
                    const res = await fetch('/api/command');
                    if (!res.ok) return;
                    const data = await res.json();
                    if (!data || !data.command) return;

                    const cmd = data.command;
                    const ts = Number(cmd.ts) || 0;
                    const lastTs = Number(localStorage.getItem(CMD_TS_KEY)) || 0;

                    // Only act on commands newer than the last seen timestamp
                    if (ts > lastTs && cmd.action) {
                        const action = cmd.action;
                        console.log('Received remote action:', action, 'ts=', ts, 'lastTs=', lastTs);
                        try {
                            if (action === 'pause') {
                                videoPlayer.pause();
                            } else if (action === 'play') {
                                videoPlayer.play();
                            } else if (action === 'next') {
                                currentIndex = (currentIndex + 1) % playlist.length;
                                isPlaying = false;
                                playNext();
                            } else if (action === 'prev') {
                                currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                                isPlaying = false;
                                playNext();
                            }
                        } catch (err) {
                            console.error('Error applying remote action', err);
                        }

                        // Mark command as seen so other polls don't re-run it on this client
                        try {
                            localStorage.setItem(CMD_TS_KEY, String(ts));
                        } catch (err) {
                            // ignore storage errors
                        }
                    }
                } catch (e) {
                    // ignore
                }
            }

            // Poll every 2s
            setInterval(pollCommands, 2000);
            // YouTube watchdog every 5s
            setInterval(youtubeWatchdog, 5000);
        
        // ===== INITIALIZE =====
        // Prevent context menu
        document.oncontextmenu = () => false;
        
        // Load playlists on page load
        loadPlaylists();
        
        console.log('Ready - Playlist selection mode');
    </script>
</body>
